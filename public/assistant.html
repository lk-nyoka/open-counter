<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Counter assistant</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<nav><a href="/">Protocol demo</a><a class="cur" href="/assistant.html">Voice assistant</a><a href="/interview.html">Set up your business</a></nav>
<header>
  <h1 id="title">Voice assistant</h1>
  <p class="sub">A simulated Alexa-style assistant. A language model decides what to say; every action goes through the business's MCP server, and the server enforces the rules.</p>
</header>
<main>
  <section>
    <h2>Talk to the assistant</h2>
    <div id="chat" aria-live="polite"></div>
    <div class="row">
      <button id="mic" class="mic" title="Speak">🎙 Speak</button>
      <input id="text" placeholder="…or type here and press Enter" maxlength="500" autocomplete="off">
      <button id="send" class="primary">Send</button>
    </div>
    <div class="row note">
      <label><input type="checkbox" id="tts" checked> Speak replies</label>
      <label><input type="checkbox" id="hands"> Hands-free (listen after each reply)</label>
      <span id="vnote"></span>
    </div>
    <p class="note" id="status"></p>
  </section>
  <section>
    <h2>MCP protocol log</h2>
    <div id="log"></div>
  </section>
</main>
<script>
const slug = new URLSearchParams(location.search).get("business") || "demo-barber";
const ENDPOINT = `/mcp/${encodeURIComponent(slug)}`;
const $ = (id) => document.getElementById(id);
let rpcId = 0, info = null, history = [], avail = {}, gate = null, listening = false, busy = false;

/* ---------- MCP client (this page talks Streamable HTTP to the server) ---------- */
function log(kind, label, obj) {
  const d = document.createElement("div"), l = document.createElement("span"), b = document.createElement("span");
  l.className = "lbl"; l.textContent = label + "\n"; b.className = kind; b.textContent = JSON.stringify(obj, null, 1) + "\n\n";
  d.append(l, b); $("log").append(d); $("log").scrollTop = $("log").scrollHeight;
}
async function rpc(method, params) {
  const body = { jsonrpc: "2.0", id: ++rpcId, method, params };
  log("req", `-> ${method}`, body);
  const r = await fetch(ENDPOINT, { method: "POST", headers: { "content-type": "application/json", accept: "application/json, text/event-stream" }, body: JSON.stringify(body) });
  const j = await r.json(); log("res", `<- ${r.status}`, j);
  if (j.error) throw new Error(j.error.message);
  return j.result;
}
const tool = async (name, args) => (await rpc("tools/call", { name, arguments: args })).structuredContent;

/* ---------- chat UI ---------- */
function bubble(kind, text) {
  const d = document.createElement("div"); d.className = "b " + kind; d.textContent = text;
  $("chat").append(d); $("chat").scrollTop = $("chat").scrollHeight; return d;
}
const setStatus = (t) => ($("status").textContent = t || "");

/* ---------- voice: record -> Whisper (server) -> text; browser recognition is the fallback ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const CAN_REC = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
let rec = null, useWhisper = CAN_REC, stopRec = null;
if (!SR && !CAN_REC) { $("mic").disabled = true; $("hands").disabled = true; $("vnote").textContent = "Voice input is not supported in this browser. Typing works everywhere."; }
$("vnote").textContent = $("vnote").textContent || (CAN_REC ? "Speak naturally, pauses are fine. I stop listening after about 2 seconds of silence." : "");
const rv = document.createElement("label"); rv.innerHTML = '<input type="checkbox" id="review"> Show what I heard before sending'; $("vnote").before(rv);
function speak(text) {
  return new Promise((res) => {
    if (!$("tts").checked || !("speechSynthesis" in window)) return res();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); let done = false;
    const fin = () => { if (!done) { done = true; res(); } };
    u.onend = u.onerror = fin; setTimeout(fin, 2000 + text.length * 90); // never hang if the browser has no voices
    speechSynthesis.speak(u);
  });
}
const setMic = (on, label) => { listening = on; $("mic").classList.toggle("on", on); $("mic").textContent = label || (on ? "● Listening" : "🎙 Speak"); };
const JUNK = /^(thank you\.?|thanks\.?|thanks for watching\.?|you\.?|bye\.?|\.+|um+\.?|uh+\.?|hmm+\.?)$/i; // Whisper often invents these on silence
function heard(text) {
  text = (text || "").trim();
  if (!text || JUNK.test(text)) { setStatus("I did not catch that. Tap the mic and try again."); return; }
  if ($("review").checked && !gate) { $("text").value = text; $("text").focus(); setStatus("Check the text, fix anything, then press Send."); return; }
  $("text").value = ""; submit(text);
}
async function transcribe(blob) {
  const r = await fetch(`/api/transcribe?business=${encodeURIComponent(slug)}&lang=${(navigator.language || "en").slice(0, 2).toLowerCase()}`, { method: "POST", headers: { "content-type": blob.type || "audio/webm" }, body: blob });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.message || "transcription failed");
  return j.text || "";
}
async function recordOnce() {
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
  catch { setStatus("Microphone permission was denied. You can still type."); return; }
  const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/mp4"].find((m) => MediaRecorder.isTypeSupported(m)) || "";
  const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined), chunks = [];
  mr.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  const ac = new (window.AudioContext || window.webkitAudioContext)(), an = ac.createAnalyser(); an.fftSize = 1024;
  ac.createMediaStreamSource(stream).connect(an);
  const buf = new Float32Array(an.fftSize);
  const t0 = performance.now(); let floor = 0.01, calib = [], speechMs = 0, lastVoice = 0, started = false, manual = false, finished = false;
  setMic(true); setStatus("Listening… take your time.");
  const done = new Promise((resolve) => {
    const tick = setInterval(() => {
      an.getFloatTimeDomainData(buf); let s = 0; for (const v of buf) s += v * v; const rms = Math.sqrt(s / buf.length), now = performance.now() - t0;
      $("mic").style.setProperty("--lvl", Math.min(1, rms * 12));
      if (now < 400) { calib.push(rms); floor = Math.max(0.006, calib.reduce((a, b) => a + b, 0) / calib.length); return; }
      if (rms > Math.max(0.02, floor * 3)) { started = true; speechMs += 50; lastVoice = now; }
      const silent = now - lastVoice;
      if (manual || now > 25000 || (started && speechMs > 250 && silent > 2200) || (!started && now > 8000)) { clearInterval(tick); resolve(); }
    }, 50);
  });
  stopRec = () => { manual = true; };
  mr.start(250);
  await done;
  finished = true; stopRec = null;
  const stopped = new Promise((r) => (mr.onstop = r)); mr.stop(); await stopped;
  stream.getTracks().forEach((t) => t.stop()); ac.close().catch(() => {});
  setMic(false); $("mic").style.removeProperty("--lvl");
  if (!started && !manual) { setStatus("I did not hear anything. Tap the mic and try again."); return; }
  setStatus("Understanding…"); setMic(true, "… Understanding");
  try { const text = await transcribe(new Blob(chunks, { type: mr.mimeType || mime || "audio/webm" })); setMic(false); setStatus(""); heard(text); }
  catch (e) {
    setMic(false);
    if (SR) { useWhisper = false; setStatus("The AI transcriber is unavailable, so I switched to your browser's speech recognition. Tap the mic again."); }
    else setStatus("Could not understand the audio: " + e.message + " You can type instead.");
  }
}
function listenBrowser() {
  speechSynthesis && speechSynthesis.cancel();
  rec = new SR(); rec.lang = navigator.language || "en-US"; rec.interimResults = true; rec.maxAlternatives = 1;
  try { rec.phrases = (info?.services || []).map((s) => ({ phrase: s.name, boost: 5 })); } catch {}
  rec.onstart = () => setMic(true);
  rec.onresult = (e) => { const t = [...e.results].map((r) => r[0].transcript).join(" "); $("text").value = t; if (e.results[e.results.length - 1].isFinal) heard(t); };
  rec.onerror = (e) => setStatus(e.error === "not-allowed" ? "Microphone permission was denied. You can still type." : e.error === "no-speech" ? "" : "Voice error: " + e.error);
  rec.onend = () => setMic(false);
  try { rec.start(); } catch {}
}
function listen() {
  if (listening || (busy && !gate)) return;
  speechSynthesis && speechSynthesis.cancel();
  if (useWhisper) recordOnce(); else if (SR) listenBrowser();
}
$("mic").onclick = () => { if (!listening) return listen(); if (stopRec) stopRec(); else if (rec) rec.stop(); };

/* ---------- confirmation gate: the human, not the model, says yes ---------- */
function confirmBooking(service, when, price, currency, who) {
  return new Promise((resolve) => {
    const c = document.createElement("div"); c.className = "card gate";
    const t = document.createElement("div"); t.textContent = `Confirm booking: ${service}, ${when}, ${price} ${currency}, for ${who}.`;
    const row = document.createElement("div"); row.className = "row";
    const yes = document.createElement("button"), no = document.createElement("button");
    yes.className = "primary"; yes.textContent = "Yes, book it"; no.textContent = "No";
    row.append(yes, no); c.append(t, row); $("chat").append(c); $("chat").scrollTop = $("chat").scrollHeight;
    const done = (v) => { gate = null; c.remove(); resolve(v); };
    gate = { yes: () => done(true), no: () => done(false) };
    yes.onclick = () => gate.yes(); no.onclick = () => gate.no();
    speak(`Please confirm: ${service}, ${when}, ${price} ${currency}. Say yes or no.`).then(() => $("hands").checked && listen());
  });
}
const YES = /^\s*(yes|yeah|yep|yup|sure|confirm|ok|okay|book it|go ahead)\b/i, NO = /^\s*(no|nope|nah|cancel|don'?t|stop)\b/i;

/* ---------- tools the model may ask for (all go through MCP) ---------- */
const compact = (o) => JSON.stringify(o).slice(0, 900);
async function runTool(r) {
  try {
    if (r.tool === "check_availability") {
      const svc = info.services.find((s) => s.id === r.serviceId);
      if (!svc) return { ok: false, error: "unknown serviceId" };
      if (!/^\d{4}-\d\d-\d\d$/.test(r.date || "")) return { ok: false, error: "date must be YYYY-MM-DD" };
      const a = await tool("check_availability", { serviceId: svc.id, date: r.date });
      if (!a.ok) return { ok: false, error: a.message };
      avail[`${svc.id}|${r.date}`] = Object.fromEntries(a.slots.map((s) => [s.start.slice(11, 16), s]));
      return { ok: true, date: r.date, service: svc.id, freeTimes: a.slots.map((s) => s.start.slice(11, 16)), note: a.count ? undefined : "no free times that day" };
    }
    if (r.tool === "get_quote") return await tool("get_quote", { serviceId: r.serviceId || "" });
    if (r.tool === "book") {
      const svc = info.services.find((s) => s.id === r.serviceId);
      const slot = (avail[`${r.serviceId}|${r.date}`] || {})[r.time];
      if (!svc || !slot) return { ok: false, error: "that time was not in the availability list; call check_availability first" };
      if (!r.customerName) return { ok: false, error: "customer name is missing; ask for it" };
      const yes = await confirmBooking(svc.name, slot.startLocal, svc.price, info.currency, r.customerName);
      if (!yes) return { ok: false, declined: true, error: "the customer declined" };
      const b = await tool("book", { serviceId: svc.id, start: slot.start, customerName: r.customerName, customerPhone: r.customerPhone, customerConfirmed: true, idempotencyKey: crypto.randomUUID() });
      if (b.ok) showBooking(b);
      return b.ok ? { ok: true, when: b.startLocal, bookingCode: b.bookingId } : { ok: false, error: b.message };
    }
    if (r.tool === "cancel") {
      const c = await tool("cancel", { bookingId: r.bookingId || "" });
      return c.ok ? { ok: true } : { ok: false, error: c.message };
    }
    return { ok: false, error: "unknown tool" };
  } catch (e) { return { ok: false, error: "the booking system could not be reached" }; }
}
function showBooking(b) {
  const c = document.createElement("div"); c.className = "card";
  const t = document.createElement("div"); t.textContent = `Booked: ${b.service}, ${b.startLocal}`;
  const code = document.createElement("div"); code.className = "note"; code.append("Booking code (needed to cancel): "); const k = document.createElement("code"); k.textContent = b.bookingId; code.append(k);
  c.append(t, code); $("chat").append(c); $("chat").scrollTop = $("chat").scrollHeight;
}

/* ---------- agent loop: model decides, MCP acts ---------- */
async function turn() {
  for (let i = 0; i < 6; i++) {
    setStatus("Thinking…");
    let r;
    try {
      const res = await fetch("/api/assistant", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ business: slug, messages: history }) });
      const j = await res.json();
      if (!res.ok) { bubble("sys", (j.message || "The assistant is unavailable right now.") + (Array.isArray(j.detail) && j.detail.length ? " (" + j.detail.slice(0, 2).join("; ").slice(0, 160) + " — see /api/ai-check)" : "")); if (res.status === 429 || res.status === 503) { const a = document.createElement("a"); a.href = "/"; a.textContent = "Use the manual booking page instead"; $("chat").append(a); } setStatus(""); return; }
      r = j;
    } catch { bubble("sys", "Could not reach the assistant."); setStatus(""); return; }
    history.push({ role: "assistant", content: JSON.stringify({ say: r.say, tool: r.tool, serviceId: r.serviceId, date: r.date, time: r.time, customerName: r.customerName, bookingId: r.bookingId }) });
    if (r.tool === "none") { bubble("bot", r.say); setStatus(""); await speak(r.say); return true; }
    if (r.say) bubble("bot interim", r.say);
    setStatus("Checking with the booking system…");
    const result = await runTool(r);
    history.push({ role: "user", content: `TOOL_RESULT ${r.tool}: ${compact(result)}` });
  }
  bubble("sys", "I got stuck. Could you rephrase that?"); setStatus("");
}
async function submit(text) {
  text = (text || "").trim(); if (!text) return;
  if (gate) { if (YES.test(text)) gate.yes(); else if (NO.test(text)) gate.no(); else bubble("sys", "Please answer yes or no to confirm the booking."); return; }
  if (busy) return;
  busy = true; speechSynthesis && speechSynthesis.cancel();
  bubble("me", text); history.push({ role: "user", content: text });
  let again = false;
  try { again = await turn(); } finally { busy = false; }
  if (again && $("hands").checked) listen();
}
$("send").onclick = () => { const t = $("text").value; $("text").value = ""; submit(t); };
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter") $("send").click(); });

/* ---------- start ---------- */
(async () => {
  try {
    await rpc("initialize", { protocolVersion: "2025-06-18", capabilities: {}, clientInfo: { name: "open-counter-assistant", version: "0.2.0" } });
    await rpc("tools/list", {});
    info = await tool("get_business_info", {});
    $("title").textContent = info.name;
    bubble("bot", `Hi, I'm the booking assistant for ${info.name}. What can I do for you?`);
    speak(`Hi, I'm the booking assistant for ${info.name}. What can I do for you?`);
  } catch (e) { bubble("sys", "Could not load this business. Check the link."); $("send").disabled = true; $("mic").disabled = true; }
})();
</script>
</body>
</html>
