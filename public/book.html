<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book online</title>
<link rel="stylesheet" href="/app.css">
<style>
  .one { max-width:720px; margin:0 auto; padding:8px 16px 40px; display:grid; gap:16px }
  .opts { display:flex; flex-wrap:wrap; gap:8px } .opts button.sel { border-color:var(--accent); outline:2px solid var(--accent) }
</style>
</head>
<body>
<nav><a href="/">Home</a><a href="/interview.html">Set up a business</a><a href="/dashboard.html">Owner dashboard</a><a href="/assistant.html">Voice assistant</a><a class="cur" href="/book.html">Book online</a><a href="/protocol.html">MCP protocol</a></nav>
<header><h1 id="title">Book online</h1><p class="sub" id="sub"></p></header>
<div class="one">
  <section><h2>1. Service</h2><div class="opts" id="svcs"></div></section>
  <section><h2>2. Day and time</h2><div class="row"><input type="date" id="date" style="flex:0 0 auto"></div><div class="opts" id="times"></div><p class="note" id="tnote"></p></section>
  <section id="who" class="hidden"><h2>3. Your details</h2>
    <div class="row"><input id="name" placeholder="Your name" maxlength="80"><input id="phone" placeholder="Phone (optional)" maxlength="30"></div>
    <p id="summary"></p>
    <div class="row"><button id="book" class="primary">Confirm booking</button></div>
    <p id="msg"></p>
  </section>
  <section id="done" class="hidden"><h2>You're booked</h2><p id="doneText"></p><p class="note">Booking code (keep it to cancel): <code id="code"></code></p><div class="row"><button id="cancel">Cancel this booking</button></div></section>
</div>
<script>
const $ = (id) => document.getElementById(id);
const slug = new URLSearchParams(location.search).get("business") || "demo-barber";
const base = `/api/public/businesses/${encodeURIComponent(slug)}`;
let info, svc, slot, booking, key = crypto.randomUUID();
const api = async (p, o = {}) => { const r = await fetch(base + p, { ...o, headers: { "content-type": "application/json" } }); return { ok: r.ok, j: await r.json().catch(() => ({})) }; };
const btn = (text, on) => { const b = document.createElement("button"); b.textContent = text; b.onclick = on; return b; };
const select = (box, b) => { [...box.children].forEach((x) => x.classList.remove("sel")); b.classList.add("sel"); };

(async () => {
  const r = await api("");
  if (!r.ok) { $("title").textContent = "Business not found"; return; }
  info = r.j; $("title").textContent = `Book at ${info.name}`;
  $("sub").textContent = info.acceptingBookings ? `Times are in ${info.timezone}.` : "This business is not taking online bookings right now.";
  for (const s of info.services.filter((x) => x.bookableByVoice)) {
    const b = btn(`${s.name} · ${s.durationMin} min · ${s.price} ${info.currency}`, () => { svc = s; select($("svcs"), b); loadTimes(); });
    $("svcs").append(b);
  }
  const blocked = info.services.filter((x) => !x.bookableByVoice);
  if (blocked.length) $("svcs").insertAdjacentHTML("afterend", `<p class="note">${blocked.map((x) => x.name).join(", ")}: please contact ${info.name} directly.</p>`);
  $("date").value = new Intl.DateTimeFormat("en-CA", { timeZone: info.timezone }).format(new Date(Date.now() + 86400000));
  $("date").onchange = loadTimes;
})();

async function loadTimes() {
  if (!svc) return;
  $("times").textContent = ""; $("tnote").textContent = "Checking…"; slot = null; $("who").classList.add("hidden");
  const r = await api(`/availability?serviceId=${svc.id}&date=${$("date").value}`);
  $("tnote").textContent = !r.ok ? r.j.message : r.j.slots.length ? "" : "No free times that day. Try another day.";
  for (const s of r.ok ? r.j.slots : []) {
    const b = btn(s.start.slice(11, 16), () => { slot = s; select($("times"), b); $("who").classList.remove("hidden"); $("summary").textContent = `${svc.name}, ${s.startLocal}, ${svc.price} ${info.currency}.`; });
    $("times").append(b);
  }
}

$("book").onclick = async () => {
  const name = $("name").value.trim();
  if (!name) { $("msg").className = "bad"; $("msg").textContent = "Please enter your name."; return; }
  $("book").disabled = true;
  const r = await api("/bookings", { method: "POST", body: JSON.stringify({ serviceId: svc.id, start: slot.start, customerName: name, customerPhone: $("phone").value.trim() || undefined, customerConfirmed: true, idempotencyKey: key }) });
  $("book").disabled = false;
  if (!r.j.ok) { $("msg").className = "bad"; $("msg").textContent = r.j.message || "Could not book."; loadTimes(); return; }
  booking = r.j; key = crypto.randomUUID();
  $("doneText").textContent = `${r.j.service}, ${r.j.startLocal}.`; $("code").textContent = r.j.bookingId;
  $("done").classList.remove("hidden"); $("who").classList.add("hidden"); $("msg").textContent = "";
};
$("cancel").onclick = async () => {
  const r = await api(`/bookings/${booking.bookingId}/cancel`, { method: "POST", body: "{}" });
  $("doneText").textContent = r.j.ok ? "Your booking is cancelled." : r.j.message || "Could not cancel.";
  if (r.j.ok) { $("cancel").disabled = true; loadTimes(); }
};
</script>
</body>
</html>
