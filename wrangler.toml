name = "open-counter"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "open-counter"
database_id = "0db96c7a-e2ea-4650-b353-6e36bf4c37da"

[ai]
binding = "AI"

[vars]
# Global cap on language-model calls per day, to protect the free Workers AI allowance (10,000 neurons/day).
AI_DAILY_CALLS = "200"
# Models are chosen in code with automatic fallbacks. To force one, add e.g.:
# ASSISTANT_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
