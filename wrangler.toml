name = "open-counter"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "open-counter"
database_id = "0db96c7a-e2ea-4650-b353-6e36bf4c37da"

[ai]
binding = "AI"

[vars]
# Models on the free Workers AI plan (10,000 neurons/day). Swap here if a model is unavailable on your account.
# Global cap on AI calls per day, to protect the free allowance.
AI_DAILY_CALLS = "200"
